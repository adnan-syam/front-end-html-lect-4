<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>التسجيل في نادي الطلاب</h1>
    <form action="" method="post">
        <fieldset>
            <legend> :البيانات الشخصية: </legend>
            <label for="name">السم</label>
            <input type="text" name="name" id="name" placeholder="اكتب اسمك">
            <br>
            <label for="bad" > تاريخ الميلاد: </label>
            <input type="date" name="bad" id="bad">
            <br>
            <label>الجنس: </label>
            <br>
            <label for="male">ذكر</label>
            <input type="radio" name="gender" id="male" value="male">
            <br>
            <label for="female">انثى</label>
            <input type="radio" name="gender" id="female" value="female">
        </fieldset>
        <fieldset>
            <legend>بيانات الحساب</legend>
            <label for="email">البريد الاكتروني: </label>
            <input type="email" name="email" id="email">
            <br>
            <label for="password">كلمة المرور: </label>
            <input type="password" name="password" id="password">
        </fieldset>
        <fieldset>
            <legend>الاهتمامات</legend>
            <label>الصف: </label>
            <select id="">
                <option disabled selected>--اختر--</option>
                <option> الصف الأول</option>
                <option> الصف الثاني</option>
                <option> الصف الثالث</option>
                <option> الصف الرابع</option>
            </select>
            <br>
            <label>الأنشطة التي تفضلها</label>
            <br>    
            <label for="coding">البرمجة</label>
            <input type="checkbox" name="coding" id="coding">
            <br>
            <label for="sports">الرياضة</label>
            <input type="checkbox" name="sports" id="sports">
            <br>
            <label for="arts">الفنون</label>
            <input type="checkbox" name="arts" id="arts">
            <br>
            <label for="why">لماذا تريد الانضمام؟</label>
            <br>
            <textarea id="why" name="why" rows="5" cols="40"></textarea>
        </fieldset>
        <button type="submit">تسجيل</button>
      <button type="reset">مسح</button>
    </form>
</body>
</html>
